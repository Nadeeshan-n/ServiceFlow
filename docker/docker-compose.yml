
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: serviceflow-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - serviceflow_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build:
      context: ..
      dockerfile: mcp_server/Dockerfile
    restart: unless-stopped
    environment:
      MCP_DB_HOST: db
      MCP_DB_NAME: ${POSTGRES_DB}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-}
      MCP_SIGNING_KEY: ${MCP_SIGNING_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    # No published port: only containers on this Compose network can reach MCP.

  backend:
    profiles: ["ai"]
    build:
      context: ..
      dockerfile: backend/Dockerfile.ai
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MCP_URL: http://mcp:8001/mcp
      MCP_SIGNING_KEY: ${MCP_SIGNING_KEY:-}
    volumes:
      - ../backend/storage:/srv/backend/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_started

volumes:
  serviceflow_pgdata:
